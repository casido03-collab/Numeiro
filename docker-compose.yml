version: "3.9"

services:
  checker:
    image: numeiro-app:latest   # переиспользует образ, собранный сервисом bot
    env_file: .env
    restart: unless-stopped
    volumes:
      - .:/app
    command: python -m checker_bot.main
    # Порт 8081 НЕ пробрасывается наружу — доступен только внутри Docker-сети

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot-health
      pull: false    # не тянуть python:3.12-slim из Docker Hub, использовать кеш
    image: numeiro-app:vk-menu-20261103
    env_file: .env
    depends_on:
      - postgres
      - redis
      - checker
    restart: unless-stopped
    volumes:
      - .:/app
    command: python -m bot.main
    ports:
      - "8080:8080"
    healthcheck:
      # Проверяем heartbeat, polling, scheduler и зависимости, независимо от активности клиентов
      test: ["CMD", "python", "/usr/local/bin/numeiro-healthcheck.py"]
      interval: 120s      # проверять каждые 2 минуты
      timeout: 5s
      retries: 3          # 3 провала подряд → unhealthy → Docker рестартует
      start_period: 60s   # не проверять первые 60 сек (время старта)

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: numeiro
      POSTGRES_USER: numeiro
      POSTGRES_PASSWORD: numeiro_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт не пробрасываем наружу — бот достучится внутри Docker-сети
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    # Порт не пробрасываем наружу — бот достучится внутри Docker-сети

volumes:
  pgdata:
  redisdata:
